# Include this file inside the existing dev.margins.cloud HTTPS server block.
location = /imgym {
  proxy_pass http://127.0.0.1:5820;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /imgym/ {
  # Matches WEB_ASSET_MULTIPART_LIMIT (MAX_BATCH_BYTES 50 MiB + 2 MiB of
  # multipart overhead). Anything lower rejects uploads the app would accept,
  # and nginx answers with its own HTML page instead of the app's error.
  client_max_body_size 52m;

  proxy_pass http://127.0.0.1:5820;
  proxy_http_version 1.1;
  proxy_buffering off;

  proxy_connect_timeout 10s;
  proxy_send_timeout 300s;
  proxy_read_timeout 300s;

  proxy_set_header Host $host;
  proxy_set_header Authorization $http_authorization;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
}
